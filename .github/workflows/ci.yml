name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Continuous Integration (Lint, Typecheck, Test, Validate, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nst_events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nst_events"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @nst/database db:validate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events"

      - name: Generate Prisma Client
        run: pnpm --filter @nst/database db:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events"

      - name: Apply Database Migrations
        run: pnpm --filter @nst/database db:migrate:deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events"

      - name: Run Database Seed
        run: pnpm --filter @nst/database db:seed
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nst_events"

      - name: Lint across workspaces
        run: pnpm lint

      - name: Typecheck across workspaces
        run: pnpm typecheck

      - name: Run tests across workspaces
        run: pnpm test

      - name: Build workspaces
        run: pnpm build
