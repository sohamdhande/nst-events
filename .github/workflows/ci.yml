name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI Pipeline (lint, typecheck, test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint across workspaces
        run: pnpm lint

      - name: Typecheck across workspaces
        run: pnpm typecheck

      - name: Run tests across workspaces
        run: pnpm test
