# Kubernetes Secrets — NST Events
#
# WARNING: This file is a TEMPLATE ONLY.
# Do NOT commit real credentials to version control.
#
# In production, secrets must be injected via:
#   - Kubernetes External Secrets Operator
#   - Sealed Secrets (Bitnami)
#   - Cloud provider secret manager (AWS Secrets Manager, GCP Secret Manager)
#
# Usage:
#   1. Copy this file to secrets.local.yaml (gitignored)
#   2. Fill in real values
#   3. kubectl apply -f secrets.local.yaml

apiVersion: v1
kind: Secret
metadata:
  name: nst-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: ''       # postgresql://user:pass@host:5432/nst_events?schema=public
  POSTGRES_USER: ''      # Database username
  POSTGRES_PASSWORD: ''  # Database password
  POSTGRES_DB: ''        # Database name
  JWT_SECRET: ''         # Minimum 32 characters
  GOOGLE_CLIENT_ID: ''   # Google OAuth client ID
  GOOGLE_CLIENT_SECRET: '' # Google OAuth client secret
  EXPO_PUSH_TOKEN: ''    # Expo push notification access token
