apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-api
  namespace: default
  labels:
    app: nst-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nst-api
  template:
    metadata:
      labels:
        app: nst-api
    spec:
      containers:
        - name: api
          image: nst-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: nst-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nst-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nst-api
  ports:
    - port: 80
      targetPort: 3001
