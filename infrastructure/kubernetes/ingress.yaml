apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nst-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: api.nst-events.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nst-api-service
                port:
                  number: 80
