apiVersion: apps/v1
kind: Deployment
metadata:
  name: nst-api
  namespace: default
  labels:
    app: nst-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nst-api
  template:
    metadata:
      labels:
        app: nst-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: nst-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: nst-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nst-api-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: nst-api
  ports:
    - port: 80
      targetPort: 3001
