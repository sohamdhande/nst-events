apiVersion: v1
kind: Secret
metadata:
  name: nst-api-secrets
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: ''       # postgresql://user:pass@host:5432/nst_events?schema=public
  JWT_SECRET: ''         # Minimum 32 characters
  GOOGLE_CLIENT_ID: ''   # Google OAuth client ID
  GOOGLE_CLIENT_SECRET: '' # Google OAuth client secret
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-worker-secrets
  namespace: default
type: Opaque
stringData:
  WORKER_DATABASE_URL: '' # postgresql://worker_user:pass@host:5432/nst_events?schema=public
  EXPO_PUSH_TOKEN: ''    # Expo push notification access token
---
apiVersion: v1
kind: Secret
metadata:
  name: nst-db-admin-secrets
  namespace: default
type: Opaque
stringData:
  POSTGRES_USER: ''      # Database username
  POSTGRES_PASSWORD: ''  # Database password
  POSTGRES_DB: ''        # Database name
